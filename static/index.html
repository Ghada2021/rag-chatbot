<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STAR Assurances — Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & variables ──────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #0b0f19;
      --surface:   #141929;
      --surface-2: #1c2237;
      --border:    #262e48;
      --text:      #e2e8f8;
      --text-dim:  #7b85a3;
      --accent:    #3b82f6;
      --accent-2:  #60a5fa;
      --user-bg:   #1e3a5f;
      --bot-bg:    #1a1f33;
      --green:     #34d399;
      --font:      'IBM Plex Sans Arabic', system-ui, sans-serif;
      --mono:      'JetBrains Mono', monospace;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: grid; place-items: center;
      font-weight: 700; font-size: 18px; color: #fff;
      letter-spacing: -0.5px;
    }

    header h1 { font-size: 18px; font-weight: 600; letter-spacing: .3px; }
    header p  { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      margin-left: auto;
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }

    /* ── Chat area ──────────────────────────────────────────── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Messages ────────────────────────────────────────────── */
    .msg {
      max-width: 720px;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.65;
      font-size: 14.5px;
      animation: fadeUp .3s ease;
      position: relative;
      word-wrap: break-word;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg.bot .label {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    /* sources accordion */
    .sources-toggle {
      margin-top: 10px;
      font-size: 12px;
      color: var(--accent-2);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sources-toggle svg { transition: transform .2s; }
    .sources-toggle.open svg { transform: rotate(90deg); }

    .sources-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease;
    }
    .sources-list.open { max-height: 400px; }

    .source-chip {
      margin-top: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.5;
      font-family: var(--mono);
    }

    /* typing indicator */
    .typing-dots { display: flex; gap: 5px; padding: 6px 0; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-dim);
      animation: blink 1.4s infinite both;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .25; }
      40% { opacity: 1; }
    }

    /* welcome */
    .welcome {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-dim);
      animation: fadeUp .5s ease;
    }
    .welcome h2 {
      font-size: 22px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .welcome p { font-size: 14px; max-width: 440px; margin: 0 auto; line-height: 1.6; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }
    .suggestions button {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .suggestions button:hover {
      background: var(--border);
      border-color: var(--accent);
    }

    /* ── Input bar ──────────────────────────────────────────── */
    .input-bar {
      padding: 16px 24px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 780px;
      margin: 0 auto;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px 6px 6px 18px;
      transition: border-color .2s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }

    #input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14.5px;
      font-family: var(--font);
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }
    #input::placeholder { color: var(--text-dim); }

    #send {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background .15s, transform .1s;
      flex-shrink: 0;
    }
    #send:hover { background: var(--accent-2); }
    #send:active { transform: scale(.93); }
    #send:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      #chat  { padding: 16px; }
      .input-bar { padding: 12px 16px 16px; }
      .msg { font-size: 14px; }
    }
  </style>
</head>

<body>

<!-- ── Header ────────────────────────────────────────────── -->
<header>
  <div class="logo">S★</div>
  <div>
    <h1>STAR Assurances</h1>
    <p>Assistant virtuel</p>
  </div>
  <div class="status-dot" title="En ligne"></div>
</header>

<!-- ── Chat ──────────────────────────────────────────────── -->
<div id="chat">
  <div class="welcome">
    <h2>Bienvenue 👋</h2>
    <p>Je suis l'assistant virtuel de STAR Assurances. Posez-moi vos questions sur nos produits d'assurance.</p>
    <div class="suggestions">
      <button onclick="ask(this.textContent)">Qu'est-ce que DAR ESSLAMA ?</button>
      <button onclick="ask(this.textContent)">Assurance auto TRIK ESSLAMA</button>
      <button onclick="ask(this.textContent)">Prix assurance habitation ?</button>
    </div>
  </div>
</div>

<!-- ── Input ─────────────────────────────────────────────── -->
<div class="input-bar">
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="Écrivez votre question…" onkeydown="handleKey(event)"></textarea>
    <button id="send" onclick="send()" title="Envoyer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
  const chat   = document.getElementById('chat');
  const input  = document.getElementById('input');
  const btnSend = document.getElementById('send');
  let busy = false;

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  function ask(text) { input.value = text; send(); }

  function addMsg(role, html, sources) {
    // remove welcome on first message
    const welcome = chat.querySelector('.welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.classList.add('msg', role);

    let inner = '';
    if (role === 'bot') inner += '<div class="label">STAR Assistant</div>';
    inner += `<div class="body">${html}</div>`;

    if (sources && sources.length) {
      const id = 'src-' + Date.now();
      inner += `
        <div class="sources-toggle" onclick="toggleSources(this, '${id}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
          ${sources.length} source(s)
        </div>
        <div class="sources-list" id="${id}">
          ${sources.map(s => `<div class="source-chip">${escapeHtml(s.content.slice(0, 200))}…</div>`).join('')}
        </div>`;
    }

    div.innerHTML = inner;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.classList.add('msg', 'bot');
    div.id = 'typing';
    div.innerHTML = '<div class="label">STAR Assistant</div><div class="typing-dots"><span></span><span></span><span></span></div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }
  function removeTyping() { document.getElementById('typing')?.remove(); }

  function toggleSources(el, id) {
    el.classList.toggle('open');
    document.getElementById(id).classList.toggle('open');
  }

  function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function send() {
    const q = input.value.trim();
    if (!q || busy) return;

    busy = true;
    btnSend.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMsg('user', escapeHtml(q));
    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q }),
      });
      const data = await res.json();
      removeTyping();
      addMsg('bot', escapeHtml(data.answer), data.sources);
    } catch (err) {
      removeTyping();
      addMsg('bot', '⚠️ Erreur de connexion au serveur. Vérifiez que le serveur est lancé.');
    } finally {
      busy = false;
      btnSend.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
